<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate">
    <title>Redirecting…</title>
    <link rel="canonical" href="welcome.html" />
    <meta http-equiv="refresh" content="0; url=welcome.html" />
    <script>
      (function(){
        var target = 'welcome.html';
        if (location.pathname && /index\.html?$/.test(location.pathname)) {
          // stay relative at the same level
        }
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>If you are not redirected automatically, follow this <a href="welcome.html">link to the welcome page</a>.</p>
  </body>
</html>
